[package]
name = "mds-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mds-netscan.workspace = true
mds-log.workspace = true
mds-ipinfo.workspace = true
mds-collector.workspace = true
mds-config.workspace = true
mds-util.workspace = true
mds-keybindings.workspace = true
log.workspace = true
ratatui.workspace = true
semver.workspace = true
color-eyre.workspace = true
tui-textarea.workspace = true
unicode-width.workspace = true
strum.workspace = true
regex.workspace = true
smallvec.workspace = true
tui-popup = "0.7.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", optional = true }

[dev-dependencies]
mds-netscan = { workspace = true, features = ["test-utils"] }
rstest.workspace = true

[features]
default = ["clipboard"]
# arboard has no Android backend, excluded above for that target regardless of this flag
clipboard = ["dep:arboard"]
test-utils = ["mds-netscan/test-utils"]

[lints]
workspace = true
